# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Docker
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-and-push:
    name: Checkout Repository
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code    
      uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Set up Maven version
      uses: s4u/setup-maven-action@v1.22.0
      with:
        maven-version: '3.10.0'
    - name: Build with Maven
      run: mvn clean package --file pom.xml
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
        tags: |
          type=sha,format=short
          latest

    # 7. Build and push the image using the pre-compiled JAR inside target/
    - name: Push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  infrastructure:
    name: Create AWS Infrastructure with Terraform
    needs: build-test-and-push
    runs-on: ubuntu-latest
    steps:    
    - name: Checkout Code    
      uses: actions/checkout@v4    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1 # <-- Replace with your AWS region
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.17.1"
        terraform_wrapper: false # Crucial to allow reading standard terminal outputs        

    # 3. Initialize the backend, plugins, and provider configs
    - name: Terraform Init
      run: |
        terraform init
        terraform validate
        terraform apply -auto-approve
        terraform destroy -auto-approve

